            cursor: pointer;

        }

        .success { color: #13A10E; }
        .error { color: #C50F1F; }
        .warning { color: #C19C00; }
        .final-message {
            display: none;
            position: fixed;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            background: #000;
            color: #ff0000;
            padding: 50px 30px 10px 30px;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            border: 3px solid #ff0000;
        }
        .corazones {
            display: block;
            margin-top: 18px;
            letter-spacing: 3px;
            font-size: 2.7rem;
            color: #ff0033;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9998;
        }
        #youtube-player { display: none; }
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #555; }

</head>
<body>
    <div class="start-screen" id="startScreen">
        <div class="cat-container">
            <div class="inicio-msg">pa isa</div>
            <img src="https://i.ibb.co/4gjKqZSn/OIP.jpg" alt="Gato" class="cat-img" id="catImg"><br>
            <button class="start-btn" id="startBtn">TOCA AQUÍ (◕‿◕)✿</button>

    <!-- el SCRIPT ES FUNDAMENTAL -->
    <script>
        const terminal = document.getElementById('terminal');
        const overlay = document.getElementById('overlay');
        const finalMessage = document.getElementById('finalMessage');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');

        let player;
        let isPlayerReady = false;

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'bL9MfnCUiG0',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'fs': 0,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'loop': 1,
                    'playlist': 'bL9MfnCUiG0',
                    'enablejsapi': 1
                },
                events: {
                    'onReady': function(event) {
                        isPlayerReady = true;
                        event.target.mute();
                        event.target.playVideo();
                        setTimeout(function() {
                            event.target.pauseVideo();
                            event.target.unMute();
                            event.target.seekTo(0);
                        }, 100);
                    },
                    'onStateChange': function(event) {
                        if (event.data == YT.PlayerState.ENDED) {
                            player.seekTo(0);
                            player.playVideo();
                        }
                    }
                }
            });
        }

        const commands = [
            'Microsoft Windows [Versión 10.0.19045.3758]',
            '(c) Microsoft Corporation. Todos los derechos reservados.\\n',
            'C:\\\\Users\\\\Usuario> netstat -ano',
            '\\nConexiones activas',
            '  Proto  Dirección local        Dirección remota       Estado           PID',
            '  TCP    192.168.1.105:49842    52.178.17.3:443        ESTABLISHED     4856',
            '  TCP    192.168.1.105:49843    142.250.185.78:443     ESTABLISHED     7234',
            '  TCP    192.168.1.105:49845    185.199.108.133:443    <span class=\"warning\">ESTABLISHED</span>     9012',
            '  TCP    192.168.1.105:49846    <span class=\"error\">45.33.32.156:80</span>        <span class=\"error\">SYN_SENT</span>        <span class=\"error\">1337</span>',
            '\\nC:\\\\Users\\\\Usuario> tasklist | findstr \"svchost\"',
            '\\nsvchost.exe                  1024 Services                   0     12,456 K',
            'svchost.exe                  1248 Services                   0     18,332 K',
            '<span class=\"error\">svchost.exe                  6666 Services                   0    666,666 K</span>',
            '\\nC:\\\\Users\\\\Usuario> dir C:\\\\Windows\\\\Temp\\*.exe /B',
            '\\n<span class=\"error\">system32.exe</span>',
            '<span class=\"error\">backdoor.exe</span>',
            '<span class=\"error\">payload.exe</span>',
            '<span class=\"error\">keylogger.exe</span>',
            '\\nC:\\\\Users\\\\Usuario> certutil -decode C:\\\\Windows\\\\Temp\\\\payload.exe C:\\\\Users\\\\Public\\\\data.zip',
            '\\n<span class=\"success\">Entrada correctamente codificada</span>',
            '<span class=\"success\">Longitud de salida = 2048</span>',
            '<span class=\"success\">CertUtil: -decode comando completado correctamente.</span>',
            '\\nC:\\\\Users\\\\Usuario> start C:\\\\Users\\\\Public\\data.zip',
            '\\n<span class=\"warning\">[*] Iniciando descarga...</span>',

            '<span class=\"error\">[*] Capturando pantalla...</span>',
            '<span class=\"error\">[*] Activando webcam...</span>',

            '\\n<span class=\"success\">[✓] TRANSFERENCIA COMPLETA</span>',
            '<span class=\"error\">[✓] TUS DATOS HAN SIDO COMPROMETIDOS</span>',
            '<span class=\"error\">[✓] SISTEMA INFECTADO</span>',
            '\\nC:\\\\Users\\\\Usuario> shutdown /s /t 0',
            '<span class=\"error\">\\nCerrando sesión...</span>'
        ];

        let currentIndex = 0;

        startBtn.addEventListener('click', function() {
            if (isPlayerReady) {
                player.seekTo(0);
                player.playVideo();
            }
            startScreen.style.display = 'none';
            setTimeout(typeCommands, 500);
        });

        function addLine(text) {
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = text;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function typeCommands() {
            if (currentIndex < commands.length) {
                addLine(commands[currentIndex]);
                currentIndex++;
                setTimeout(typeCommands, 30);
            } else {
                setTimeout(() => {
                    showFinalMessage();
                    downloadFile();
                }, 1000);
            }
        }

        function showFinalMessage() {
            overlay.style.display = 'block';
            finalMessage.style.display = 'block';
        }

        function downloadFile() {
            const content = `sé que es una paja todo lo que estás sintiendo y que duele un montón. Una ruptura nunca es algo que uno quiere pasar, y encima cuando ya no hay amor de su lado se siente todavía más pesado. Pero también es lo mejor cuidarse uno mismo, buscar paz y estar tranquila por vos.

Anda a dormir pedazo de logi , te quiero mucho. Ya vas a volver a Ecuador y me vas a mandar mil audios llorando por el gil, pero bueno… también se te van a abrir nuevas puertas para mirarte a vos misma y ver cómo mejorar. Aprendiste una banda con todo esto y estoy orgulloso de que hayas salido de esa burbuja.

Ya vas a ver que después te cagás de risa, o capaz te sacás algúna weaaa sobre los colombianos, pero desde otro lugar, con más fuerza y más claridad. Yo estoy acá, siempre, aunque sea para escucharte putear o reirme de cualquier huevada q digas.`;

            const blob = new Blob([content], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mensaje.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
    <script src="redirect-game.js"></script>
