<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Page</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;

        }
        img {
            max-width: 100%;
            height: auto;

            background-color: #ff69b4;
            border: none;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Cat Page!</h1>
    <img src="https://placekitten.com/400/300" alt="Cute Cat">
    <button>TOCA AQUÍ CORAZÓN</button>
</body>
</html>
